<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colouring book purchase-page proofs | Angel Leaf</title><style>*{box-sizing:border-box}body{height:100svh;overflow:hidden;margin:0;background:#e9e3d8;color:#4d3522;font:14px Arial,sans-serif}header{padding:12px 16px;background:#fffaf0;border-bottom:1px solid #cab993;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}strong{margin-right:10px}a{color:inherit;padding:8px 12px;border:1px solid #aa926b;border-radius:18px;text-decoration:none}a[aria-current]{background:#71502e;color:#fff}#stage{display:flex;justify-content:center;padding:16px}#frame-wrap{position:relative;flex:none;box-shadow:0 5px 25px #35291925}iframe{display:block;border:0;transform-origin:top left;background:#fffaf0}p{font-size:12px;text-align:center;margin:10px}</style></head><body><header><strong>Purchase-page proof</strong><a id="where" href="?book=where-time-stands-still">Where Time Stands Still</a><a id="treasures" href="?book=treasures-of-another-time">Treasures of Another Time</a><a id="desktop" href="?view=desktop">Desktop</a><a id="phone" href="?view=phone">Phone</a><a id="small" href="?view=small">Small phone</a><a id="laptop" href="?view=laptop">Compact laptop</a></header><div id="stage"><div id="frame-wrap"><iframe title="Book purchase-page proof" id="proof"></iframe></div></div><p id="size"></p><script>
const params=new URLSearchParams(location.search);const book=params.get('book')==='treasures-of-another-time'?'treasures-of-another-time':'where-time-stands-still';const view=['desktop','phone','small','laptop'].includes(params.get('view'))?params.get('view'):'desktop';const sizes={desktop:[1366,768],phone:[390,844],small:[320,568],laptop:[900,600]};const [w,h]=sizes[view];document.getElementById('proof').src='book-'+book+'.html?proof=20261117-borders';document.getElementById('where').href='?book=where-time-stands-still&view='+view;document.getElementById('treasures').href='?book=treasures-of-another-time&view='+view;document.getElementById(book.startsWith('where')?'where':'treasures').setAttribute('aria-current','true');for(const v of Object.keys(sizes)){document.getElementById(v).href='?book='+book+'&view='+v;}document.getElementById(view).setAttribute('aria-current','true');for(const a of document.querySelectorAll('header a'))a.href+='&review=20261117-borders';document.getElementById('size').textContent=w+' × '+h+' · Exact viewport proof';function fit(){const frame=document.getElementById('proof'),wrap=document.getElementById('frame-wrap');const scale=Math.min(1,(innerWidth-32)/w,(innerHeight-document.querySelector('header').offsetHeight-80)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';}fit();addEventListener('resize',fit);
</script></body></html>
