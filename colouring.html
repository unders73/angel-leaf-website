<script>
const rangeTabs=[...document.querySelectorAll('.range-tab')];
const ranges=[...document.querySelectorAll('.range')];
function chooseRange(key,focus=false){
 rangeTabs.forEach(tab=>{const selected=tab.dataset.range===key;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;if(selected&&focus)tab.focus();});
 ranges.forEach(range=>range.dataset.current=String(range.id==='range-'+key));
}
rangeTabs.forEach((tab,index)=>{
 tab.addEventListener('click',()=>chooseRange(tab.dataset.range));
 tab.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%rangeTabs.length;else if(event.key==='ArrowLeft')next=(index+rangeTabs.length-1)%rangeTabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=rangeTabs.length-1;else return;event.preventDefault();chooseRange(rangeTabs[next].dataset.range,true);});
});
</script>
