<!doctype html>

<head>

<title>K-pop Activity Collection | Angel Leaf</title>

<script>if(new URLSearchParams(location.search).get('view')==='mobile')document.documentElement.dataset.view='mobile';</script>
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;min-height:100%;background:#fffcf5;color:#27202b}
body{font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
.site{container-type:inline-size;width:100%;margin:auto;overflow:hidden}
html[data-view="mobile"] .site{max-width:430px;box-shadow:0 0 40px #35212e15}
.masthead{height:83px;display:flex;justify-content:center;align-items:center;position:relative;background:#fffefb}
.brand{display:block;width:365px;line-height:0;max-width:42%}
.brand svg{width:100%;height:auto;display:block}
.back{position:absolute;left:28px;display:inline-flex;align-items:center;gap:9px;padding:12px 15px;text-decoration:none;font-size:13px;font-weight:700;color:#346725;border:1px solid #ccdcbf;border-radius:30px;background:#fffefb}
.back svg{width:17px;height:17px}
.intro{height:91px;text-align:center;position:relative;background:#fffefb;padding:0 15px 13px}
h1{font-size:clamp(26px,3.15cqw,48px);line-height:1.1;font-style:italic;font-weight:900;letter-spacing:-1.5px;margin:0;display:flex;align-items:center;justify-content:center;gap:8px;height:55px}
h1 span{color:#a72077}
.title-art{display:block;width:176px;height:55px;object-fit:contain}.title-text{display:none}
.intro p{font-family:Georgia,serif;font-size:21px;margin:9px 0 0}
.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:calc(100svh - 174px);height:42.64cqw}
.book-link{position:relative;display:block;min-width:0;isolation:isolate;text-decoration:none;--accent:#b3268e;background:#fffefb;overflow:visible}
.book-link:nth-child(2){--accent:#007f87}.book-link:nth-child(3){--accent:#447b16}.book-link:nth-child(4){--accent:#c12740}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-1;pointer-events:none}
.scene-original{mask-image:linear-gradient(transparent,#000 28px)}
.scene-top{height:40px;top:-10px;bottom:auto;object-fit:fill;mask-image:linear-gradient(#000 75%,transparent)}
.scene-mobile{display:none}
.cover-stage{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:62%;display:block}
.cover{display:block;width:100%;height:auto;aspect-ratio:17/22;object-fit:contain;border-radius:2px 4px 4px 2px;box-shadow:2px 3px 0 #fff9,5px 11px 13px #1b102c36;transition:transform .2s ease,box-shadow .2s ease;background:#fffdf8}
.book-link:focus-visible{outline:5px solid var(--accent);outline-offset:-5px}
.book-link:focus-visible .cover{transform:translateY(-7px) scale(1.025)}
@media(hover:hover){.book-link:hover .cover{transform:translateY(-8px) scale(1.035);box-shadow:3px 5px 0 #fff9,7px 19px 20px #1b102c45}.back:hover{background:#eef6e8}}
.book-link:active .cover{transform:translateY(-2px)}
@container(max-width:900px){.masthead{height:74px}.brand{width:320px}.back{left:18px;font-size:12px;padding:10px}.intro{height:86px}h1{font-size:31px}.intro p{font-size:19px}.books{min-height:calc(100svh - 160px)}}
@container(max-width:680px){
.masthead{height:66px;justify-content:flex-end;padding:7px 13px}.brand{width:230px;max-width:62%}.back{left:12px;font-size:11px;gap:5px;padding:9px 8px}.back svg{width:13px}.back .full{display:none}
.intro{height:88px;padding:5px 9px 12px}h1{font-size:27px;letter-spacing:-1px;line-height:1.15;display:block;height:auto}.intro p{font-size:18px;margin-top:8px}
.title-art,.scene-original,.scene-top{display:none}.title-text{display:inline}.scene-mobile{display:block}
.books{grid-template-columns:repeat(2,minmax(0,1fr));height:auto;min-height:calc(100svh - 154px)}
.book-link{min-height:85.3125cqw}.cover-stage{width:63%;top:41%}.cover{box-shadow:1px 2px 0 #fff9,3px 6px 8px #1b102c40}
}
@container(max-width:350px){.masthead{height:61px}.brand{width:194px}.back{left:8px;font-size:10px;padding:8px 6px}.intro{height:81px}h1{font-size:24px}.intro p{font-size:16px}.books{min-height:calc(100svh - 142px)}}
@media(prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>

</main>
</div>
</body>
