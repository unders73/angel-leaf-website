<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;min-height:100%}
main{min-height:100vh;min-height:100svh;display:grid;place-items:center}
.home{position:relative;margin:auto;line-height:0}
.desktop{width:min(100%,218.632075vh);width:min(100%,218.632075svh);--w:1854;--h:848}
.mobile{display:none;width:min(100%,50vh);width:min(100%,50svh);--w:887;--h:1774}
.home img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;left:0;width:100%;top:calc(var(--y)/var(--h)*100%);height:calc(var(--height)/var(--h)*100%);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Narrow only the desktop cover tiles; their heights, centres and all other artwork stay fixed. */
.desktop .book-backdrop{position:absolute;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 2.4%,#000 97.6%,transparent);mask-image:linear-gradient(to right,transparent,#000 2.4%,#000 97.6%,transparent)}
.desktop .book{
position:absolute;left:calc(var(--bx)/1854*100%);top:calc(var(--by)/848*100%);width:calc(var(--bw)/1854*100%);height:calc(var(--bh)/848*100%);pointer-events:none;
overflow:hidden;
}
.desktop .book::after{
content:"";position:absolute;inset:0;background-image:url('assets/opening-desktop-approved.png');background-size:calc(1854/var(--bw)*100%) calc(848/var(--bh)*100%);background-position:calc(var(--bx)/(1854 - var(--bw))*100%) calc(var(--by)/(848 - var(--bh))*100%);background-repeat:no-repeat;transform:scaleX(var(--thin));transform-origin:center;
}
.desktop .activity{--y:228;--height:193;--cy:326}
.desktop .learning{--y:432;--height:179;--cy:521}
.desktop .adult{--y:623;--height:194;--cy:712}
.desktop .arrow{
position:absolute;left:calc(1697/1854*100%);top:calc((var(--cy) - var(--y) - 48)/var(--height)*100%);width:calc(96/1854*100%);aspect-ratio:1;
display:grid;place-items:center;border-radius:50%;
background:radial-gradient(circle at 30% 20%,#679e16 0,#397100 48%,#164700 85%);
box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 5px #f3e82e,inset 0 0 0 7px #fff,inset 0 -5px 6px #123f0080;
transition:transform 180ms ease,filter 180ms ease;
}
.arrow svg{display:block;width:43%;height:55%;filter:drop-shadow(1px 2px 1px #092400);overflow:visible}
/* Mobile controls all reuse the original bottom button, at its original size and x position. */
.mobile .activity{--y:416;--height:470;--ay:593;--patch-y:580;--sample-y:704}
.mobile .learning{--y:896;--height:456;--ay:1073;--patch-y:1060;--sample-y:1184}
.mobile .adult{--y:1357;--height:323;--ay:1482}
/* Cover only the former larger controls with the adjacent matching panel texture. */
.mobile .activity::before,.mobile .learning::before{
content:"";position:absolute;left:calc(746/887*100%);top:calc((var(--patch-y) - var(--y))/var(--height)*100%);width:calc(106/887*100%);height:calc(116/var(--height)*100%);
background-image:url('assets/opening-mobile-approved.png');background-size:calc(887/106*100%) calc(1774/116*100%);background-position:calc(746/(887 - 106)*100%) calc(var(--sample-y)/(1774 - 116)*100%);background-repeat:no-repeat;
-webkit-mask-image:radial-gradient(ellipse closest-side,#000 95%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 95%,transparent 100%);pointer-events:none;
}
.mobile .arrow{
position:absolute;left:calc(775/887*100%);top:calc((var(--ay) - var(--y))/var(--height)*100%);width:calc(88/887*100%);height:calc(92/var(--height)*100%);border-radius:50%;
background-image:url('assets/opening-mobile-approved.png');background-size:calc(887/88*100%) calc(1774/92*100%);background-position:calc(775/(887 - 88)*100%) calc(1482/(1774 - 92)*100%);background-repeat:no-repeat;transition:transform 180ms ease,filter 180ms ease;
}
.hotspot:focus-visible{outline:none}
.hotspot:focus-visible .arrow{outline:3px solid #213d17;outline-offset:3px;transform:translateY(-4%) scale(1.06)}
@media(hover:hover){.hotspot:hover .arrow{transform:translateY(-4%) scale(1.06);filter:drop-shadow(0 3px 2px #173b2440)}}
.hotspot:active .arrow{transform:translateY(-1%) scale(1.02)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:680px) and (orientation:portrait){html:not([data-view="desktop"]) .desktop{display:none}html:not([data-view="desktop"]) .mobile{display:block}}
html[data-view="mobile"] .desktop{display:none}html[data-view="mobile"] .mobile{display:block}
@media(prefers-reduced-motion:reduce){.arrow{transition:none!important}}

/* Adult desktop shelf: three upright overlapping pairs, original title art shifted left. */
.desktop .adult-title{position:absolute;left:calc(658/1854*100%);top:calc(636/848*100%);width:calc(313/1854*100%);height:calc(163/848*100%);pointer-events:none}
.desktop .adult-title svg{width:100%;height:100%;display:block}
.desktop .adult-books{position:absolute;left:calc(991/1854*100%);top:calc(645/848*100%);width:calc(677/1854*100%);height:calc(150/848*100%);display:flex;justify-content:space-between;pointer-events:none}
.desktop .adult-pair{position:relative;width:29.5%;height:100%}
.desktop .adult-cover{position:absolute;top:0;height:100%;width:auto;max-width:68%;object-fit:contain;filter:drop-shadow(2px 3px 2px #382a2330)}
.desktop .adult-cover:first-child{left:0;z-index:2}.desktop .adult-cover:last-child{right:0;z-index:1}
</style>
</head>
