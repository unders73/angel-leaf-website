<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Angel Leaf — Our Collections</title>
  <meta name="description" content="Explore Angel Leaf book collections: K-pop activities, literacy and numeracy, and adult colouring.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#fff}
    .home{
      --art-width:1448;
      --art-height:1086;
      --arrow-art:url('assets/opening-design.png');
      position:relative;
      width:100%;
      margin:0 auto;
      line-height:0;
    }
    .home picture,.home img{display:block;width:100%;height:auto}
    .home img{aspect-ratio:4/3}
    .hotspot{
      display:block;
      position:absolute;
      left:0;
      width:100%;
      top:calc(var(--row-y) / var(--art-height) * 100%);
      height:calc(var(--row-height) / var(--art-height) * 100%);
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .hotspot:focus-visible{outline:none}
    .arrow-lift{
      position:absolute;
      left:calc(var(--crop-x) / var(--art-width) * 100%);
      top:calc((var(--crop-y) - var(--row-y)) / var(--row-height) * 100%);
      width:calc(var(--crop-width) / var(--art-width) * 100%);
      height:calc(var(--crop-height) / var(--row-height) * 100%);
      border-radius:50%;
      background-image:var(--arrow-art);
      background-size:calc(var(--art-width) / var(--crop-width) * 100%) calc(var(--art-height) / var(--crop-height) * 100%);
      background-position:calc(var(--crop-x) / (var(--art-width) - var(--crop-width)) * 100%) calc(var(--crop-y) / (var(--art-height) - var(--crop-height)) * 100%);
      background-repeat:no-repeat;
      pointer-events:none;
      transform-origin:center;
      transition:transform 180ms ease,filter 180ms ease;
    }
    .activity{--row-y:400;--row-height:213;--crop-x:1291;--crop-y:468;--crop-width:81;--crop-height:78}
    .learning{--row-y:626;--row-height:200;--crop-x:1296;--crop-y:685;--crop-width:81;--crop-height:76}
    .adult{--row-y:837;--row-height:213;--crop-x:1286;--crop-y:895;--crop-width:88;--crop-height:84}
    .hotspot:focus-visible .arrow-lift{transform:translateY(-4%) scale(1.10);filter:drop-shadow(0 4px 3px #173b2455)}
    @media(hover:hover){
      .hotspot:hover .arrow-lift{transform:translateY(-4%) scale(1.10);filter:drop-shadow(0 4px 3px #173b2440)}
    }
    .hotspot:active .arrow-lift{transform:translateY(-1%) scale(1.04);filter:drop-shadow(0 1px 1px #173b2433);transition-duration:70ms}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(max-width:680px) and (orientation:portrait){
      .home{
        --art-width:1024;
        --art-height:1536;
        --arrow-art:url('assets/opening-design-mobile-approved.png');
        width:min(100%,66.666667vh);
        width:min(100%,66.666667svh);
      }
      .home img{aspect-ratio:2/3}
      .activity{--row-y:473;--row-height:356;--crop-x:873;--crop-y:596;--crop-width:97;--crop-height:99}
      .learning{--row-y:838;--row-height:314;--crop-x:873;--crop-y:943;--crop-width:98;--crop-height:98}
      .adult{--row-y:1162;--row-height:277;--crop-x:897;--crop-y:1264;--crop-width:80;--crop-height:80}
    }
    @media(prefers-reduced-motion:reduce){.arrow-lift{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="home">
      <picture>
        <source media="(max-width:680px) and (orientation:portrait)" srcset="assets/opening-design-mobile-approved.png" width="1024" height="1536">
        <img src="assets/opening-design.png" width="1448" height="1086" fetchpriority="high" alt="Angel Leaf. Creative books for curious minds. Our Collections. A thoughtfully created range of books to inspire imagination, spark curiosity and bring joy to everyday life.">
      </picture>
      <a class="hotspot activity" href="activity.html" aria-label="Explore K-pop Activity Collection"><span class="arrow-lift" aria-hidden="true"></span><span class="sr">K-pop Activity Collection</span></a>
      <a class="hotspot learning" href="learning.html" aria-label="Explore K-pop Literacy and Numeracy Collection"><span class="arrow-lift" aria-hidden="true"></span><span class="sr">K-pop Literacy and Numeracy Collection</span></a>
      <a class="hotspot adult" href="colouring.html" aria-label="Explore Adult Colouring Collection"><span class="arrow-lift" aria-hidden="true"></span><span class="sr">Adult Colouring Collection</span></a>
    </div>
  </main>
</body>
</html>
